[project]
name = "agentic-rag-workspace"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "httpx>=0.28",
    "huggingface-hub>=0.27",
    "wikipedia-vectordb",
]

[project.scripts]
download-models = "experiment.models:main"
run-experiment = "experiment.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
test = ["pytest>=8.3"]

[tool.uv]
package = true
default-groups = ["test"]

[tool.uv.sources]
wikipedia-vectordb = { workspace = true }

[tool.uv.workspace]
members = ["wikipedia"]
exclude = ["repro"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["agent*", "experiment*", "fanoutqa*"]
