[project]
name = "agentic-rag-workspace"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = ["wikipedia-vectordb"]

[dependency-groups]
test = ["pytest>=8.3"]

[tool.uv]
package = false
default-groups = ["test"]

[tool.uv.sources]
wikipedia-vectordb = { workspace = true }

[tool.uv.workspace]
members = ["wikipedia"]
exclude = ["repro"]
